<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>4 Elements Arena - Karakter Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #030305; font-family: 'Segoe UI', sans-serif; user-select: none; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #fff;
            background: rgba(10, 10, 15, 0.85); padding: 15px 20px; border-radius: 8px;
            border-left: 4px solid #ff4500; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        h2 { margin: 0 0 5px 0; font-size: 18px; color: #ff4500; text-transform: uppercase; }
        p { margin: 3px 0; font-size: 13px; color: #ccc; }
        .elem-badge { font-weight: bold; padding: 2px 8px; border-radius: 4px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="ui">
    <h2>4 Elements Kolizeyi</h2>
    <p>Aktiv Element: <span id="elem-display" class="elem-badge" style="background:#ff4500; color:#fff;">ALOV</span></p>
    <p><b>W, A, S, D</b> - Hərəkət</p>
    <p><b>Sol Klik</b> - Element Hücumu</p>
    <p><b>1, 2, 3, 4</b> - Element Dəyişdir</p>
</div>

<script>
    // 1. SƏHNƏ VƏ KAMERA
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040406);
    scene.fog = new THREE.FogExp2(0x040406, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // İŞIQLANDIRMA
    const ambientLight = new THREE.AmbientLight(0x222233, 0.8);
    scene.add(ambientLight);

    // 2. DAİRƏVİ ARENA ZƏMİNİ
    const arenaRadius = 28;
    const floorGeo = new THREE.CylinderGeometry(arenaRadius, arenaRadius + 2, 2, 64);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x15151c, roughness: 0.5, metalness: 0.4 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.position.y = -1;
    floor.receiveShadow = true;
    scene.add(floor);

    // SÜTUNLAR
    const pillarCount = 10;
    const ringColors = [0xff4500, 0x1e90ff, 0x2ecc71, 0x00ced1];
    for (let i = 0; i < pillarCount; i++) {
        const angle = (i / pillarCount) * Math.PI * 2;
        const x = Math.cos(angle) * (arenaRadius - 2);
        const z = Math.sin(angle) * (arenaRadius - 2);

        const pillarGeo = new THREE.CylinderGeometry(1, 1.3, 10, 16);
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x22222a });
        const pillar = new THREE.Mesh(pillarGeo, pillarMat);
        pillar.position.set(x, 5, z);
        pillar.castShadow = true;
        scene.add(pillar);

        const pLight = new THREE.PointLight(ringColors[i % 4], 1.2, 12);
        pLight.position.set(x, 10, z);
        scene.add(pLight);
    }

    // 3. 3D KARAKTER (DÖYÜŞÇÜ MODELİ)
    const characterGroup = new THREE.Group();

    // Gövdə
    const bodyGeo = new THREE.CylinderGeometry(0.4, 0.2, 1.8, 16);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff4500, roughness: 0.3, metalness: 0.7 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.9;
    body.castShadow = true;
    characterGroup.add(body);

    // Baş/Kask
    const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
    const headMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 2.0;
    characterGroup.add(head);

    // Karakter Aurası (Parlaq İşıq)
    const charLight = new THREE.PointLight(0xff4500, 2, 10);
    charLight.position.y = 1.5;
    characterGroup.add(charLight);

    scene.add(characterGroup);

    // 4. ELEMENT PARAMETRLƏRİ
    const elements = {
        1: { name: 'ALOV', color: 0xff4500, speed: 0.22, spellColor: 0xff3300 },
        2: { name: 'SU', color: 0x1e90ff, speed: 0.18, spellColor: 0x00ffff },
        3: { name: 'TORPAQ', color: 0x2ecc71, speed: 0.14, spellColor: 0x8b5a2b },
        4: { name: 'HAVA', color: 0x00ced1, speed: 0.28, spellColor: 0xffffff }
    };
    let currentElem = elements[1];

    function setElement(num) {
        if(!elements[num]) return;
        currentElem = elements[num];
        bodyMat.color.setHex(currentElem.color);
        charLight.color.setHex(currentElem.color);
        
        const badge = document.getElementById('elem-display');
        badge.innerText = currentElem.name;
        badge.style.background = '#' + currentElem.color.toString(16);
    }

    // 5. İDARƏETMƏ VƏ HƏRƏKƏT
    const keys = {};
    window.addEventListener('keydown', e => {
        keys[e.key.toLowerCase()] = true;
        if(['1','2','3','4'].includes(e.key)) setElement(e.key);
    });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // HÜCUM / SEHR SİSTEMİ
    const spells = [];
    window.addEventListener('click', () => {
        const spellGeo = new THREE.SphereGeometry(0.35, 16, 16);
        const spellMat = new THREE.MeshBasicMaterial({ color: currentElem.spellColor });
        const spell = new THREE.Mesh(spellGeo, spellMat);
        
        spell.position.copy(characterGroup.position);
        spell.position.y = 1.2;

        // Hücum istiqaməti
        const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(characterGroup.quaternion);
        spell.userData = { dir: dir };

        scene.add(spell);
        spells.push(spell);
    });

    // ANİMASİYA DÖVRƏSİ
    function animate() {
        requestAnimationFrame(animate);

        // Karakter Hərəkəti
        const speed = currentElem.speed;
        let moved = false;

        if (keys['w']) { characterGroup.position.z -= speed; characterGroup.rotation.y = Math.PI; moved = true; }
        if (keys['s']) { characterGroup.position.z += speed; characterGroup.rotation.y = 0; moved = true; }
        if (keys['a']) { characterGroup.position.x -= speed; characterGroup.rotation.y = -Math.PI / 2; moved = true; }
        if (keys['d']) { characterGroup.position.x += speed; characterGroup.rotation.y = Math.PI / 2; moved = true; }

        // Arena Kənarlarından Çıxmamaq Şərti
        const dist = Math.sqrt(characterGroup.position.x**2 + characterGroup.position.z**2);
        if (dist > arenaRadius - 2) {
            characterGroup.position.x *= (arenaRadius - 2) / dist;
            characterGroup.position.z *= (arenaRadius - 2) / dist;
        }

        // Kameranın Karakteri İzləməsi
        camera.position.x = characterGroup.position.x;
        camera.position.z = characterGroup.position.z + 14;
        camera.position.y = characterGroup.position.y + 10;
        camera.lookAt(characterGroup.position.x, characterGroup.position.y + 1, characterGroup.position.z);

        // Sehrlərin (Mərmilərin) Hərəkəti
        for (let i = spells.length - 1; i >= 0; i--) {
            const s = spells[i];
            s.position.addScaledVector(s.userData.dir, 0.5);

            if (s.position.distanceTo(characterGroup.position) > 40) {
                scene.remove(s);
                spells.splice(i, 1);
            }
        }

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
